services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: haq
      POSTGRES_PASSWORD: haq
      POSTGRES_DB: haqdaar
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haq -d haqdaar"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://haq:haq@db:5432/haqdaar
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
